[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "transformers-xpu-helper"
version = "0.1.0"
description = "Speed up and optimize Hugging Face Transformers training on Intel XPUs, tuned for Core Ultra 7 255H (Arc 140T)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Simon Harms" }]
keywords = [
  "transformers",
  "pytorch",
  "intel",
  "xpu",
  "arc",
  "training",
  "optimization",
  "core-ultra",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.5.0",
]

[project.optional-dependencies]
transformers = [
  "transformers>=4.44.0",
  "accelerate>=0.33.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/thesimonharms/transformers-xpu-helper"
Repository = "https://github.com/thesimonharms/transformers-xpu-helper"

[project.scripts]
xpu-helper-info = "transformers_xpu_helper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transformers_xpu_helper"]

[tool.hatch.build.targets.wheel.sources]
"src/transformers_xpu_helper" = "transformers_xpu_helper"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
